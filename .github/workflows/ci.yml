name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Registry contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Formatting
        run: cargo fmt --manifest-path contracts/Cargo.toml --check

      - name: Lints
        run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path contracts/Cargo.toml

      # The contract has to survive the target it actually ships to, not just
      # the host — a wasm-only failure would otherwise reach a deploy.
      - name: Build for wasm32v1-none
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32v1-none --release

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: registry-wasm
          path: contracts/target/wasm32v1-none/release/registry.wasm
          if-no-files-found: error

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 20.9 is what Next requires and what the README promises; proving the
      # floor is more useful than proving the version we happen to develop on.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
